<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="/assets/component-slideshow.css">
    <link rel="stylesheet" href="/assets/component-slider.css">
    <link rel="stylesheet" href="/assets/lemoon-announcement-bar.css">
    <script src="/assets/global.js" defer></script>
  </head>
  <body>
    <div class="lemoon-announcement-bar">
      <slideshow-component class="announcement-bar" role="region" aria-roledescription="carousel" aria-label="Announcement bar">
        <div class="announcement-bar-slider slider-buttons">
          <button type="button" class="slider-button slider-button--prev" name="previous" aria-label="Previous announcement" aria-controls="Slider-fixture"><span class="svg-wrapper"><svg class="icon icon-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
          <div class="grid grid--1-col slider slider--everywhere" id="Slider-fixture" aria-live="polite" aria-atomic="true" data-autoplay="true" data-speed="3">
            <div class="slideshow__slide slider__slide grid__item grid--1-col" id="Slide-fixture-1" role="group" aria-roledescription="announcement" aria-label="1 of 2" tabindex="-1"><div class="announcement-bar__announcement" role="region" aria-label="Announcement"><p class="announcement-bar__message">First announcement</p></div></div>
            <div class="slideshow__slide slider__slide grid__item grid--1-col" id="Slide-fixture-2" role="group" aria-roledescription="announcement" aria-label="2 of 2" tabindex="-1"><div class="announcement-bar__announcement" role="region" aria-label="Announcement"><p class="announcement-bar__message">Second announcement</p></div></div>
          </div>
          <button type="button" class="slider-button slider-button--next" name="next" aria-label="Next announcement" aria-controls="Slider-fixture"><span class="svg-wrapper"><svg class="icon icon-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
        </div>
      </slideshow-component>
    </div>
  </body>
</html>
