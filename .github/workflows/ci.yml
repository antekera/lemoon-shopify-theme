name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-search-tests:
    name: Mobile Search Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile search tests
        run: |
          unset NO_COLOR FORCE_COLOR
          npm test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-search-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  theme-check:
    name: Theme Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Theme Check
        run: npx --yes @shopify/cli@4.8.5 theme check --fail-level warning

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    concurrency:
      group: shopify-lighthouse
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Lighthouse action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Shopify/lighthouse-ci-action
          ref: 988f0eeb44ad5f298bd47150e5b9b01c27ead975 # v1
          path: .github/actions/shopify-lighthouse
          persist-credentials: false
      - name: Fix development theme cleanup
        # Upstream checks an unassigned `theme` variable, so its EXIT trap never deletes the theme.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/actions/shopify-lighthouse/entrypoint.sh')
          source = path.read_text()
          replacements = {
              'if [[ -n "${theme+x}" ]]; then': 'if [[ "${preview_id:-}" =~ ^[0-9]+$ ]]; then',
              'shopify theme delete -d -f': 'shopify theme delete --theme "$preview_id" --force',
              '    shopify logout': '    # Token authentication does not create a persisted login in this disposable container.',
              'shopify theme push --development --json --path $theme_root > "$theme_push_log" && cat "$theme_push_log"':
                  'shopify theme push --development --json --path "$theme_root" > "$theme_push_log"\ncat "$theme_push_log"',
          }
          for original, replacement in replacements.items():
              if source.count(original) != 1:
                  raise SystemExit('Lighthouse action changed; review the cleanup patch before running.')
              source = source.replace(original, replacement)
          path.write_text(source)
          PY
          bash -n .github/actions/shopify-lighthouse/entrypoint.sh
      - name: Lighthouse
        uses: ./.github/actions/shopify-lighthouse
        with:
          store: ${{ secrets.SHOPIFY_STORE }}
          password: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
          access_token: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          collection_handle: opticos
          product_handle: lemoon-dama
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_TOKEN }}
          lhci_min_score_performance: 0.6
          lhci_min_score_accessibility: 0.8
