name: CI

on:
  workflow_dispatch:
    inputs:
      lighthouse_harness_sha:
        description: Explicitly reviewed 40-character harness commit SHA
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lighthouse-harness:
    name: Lighthouse Harness Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Credential-free container validation also runs for draft PRs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned Linux amd64 harness
        run: docker build --platform linux/amd64 -t lemoon-lighthouse scripts/lighthouse
      - name: Run harness and actual LHCI assertion tests in container
        run: docker run --rm --init --entrypoint npm lemoon-lighthouse test
      - name: Smoke real pinned browser, authentication and scored-page identity
        run: docker run --rm --init --entrypoint node lemoon-lighthouse /harness/smoke.cjs

  workflow-tests:
    name: Python Workflow Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runtime_changed: ${{ steps.scope.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate Codex workflows
        run: python3 -B scripts/test_codex_workflows.py all
      - name: Test workflow validator regressions
        run: python3 -B scripts/test_codex_workflow_validator.py -v
      - name: Test CI scope regressions
        run: python3 -B scripts/test_ci_scope.py -v
      - name: Set up pinned Node for harness tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install locked Lighthouse test tools
        run: npm ci --prefix scripts/lighthouse --ignore-scripts
      - name: Test Lighthouse harness regressions
        run: npm test --prefix scripts/lighthouse
      - name: Determine Lighthouse applicability
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci_scope.py

  mobile-search-tests:
    name: Mobile Search Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile search tests
        run: |
          unset NO_COLOR FORCE_COLOR
          npm test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-search-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  theme-check:
    name: Theme Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Theme Check
        run: npx --yes @shopify/cli@4.8.5 theme check --fail-level warning

  lighthouse:
    name: Lighthouse
    needs: workflow-tests
    # Known tooling/docs-only PRs have no storefront performance result (N/A).
    # Known harness tooling is covered by static tests; main/manual retain full audits.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.workflow-tests.outputs.runtime_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: shopify-lighthouse-lab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate immutable harness revision
        env:
          HARNESS_SHA: ${{ github.event.pull_request.base.sha || inputs.lighthouse_harness_sha || github.sha }}
        run: |
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'A reviewed immutable harness SHA is required'; exit 1; }
      - name: Check out trusted harness separately from PR theme payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.lighthouse_harness_sha || github.sha }}
          path: .lighthouse-trusted
          persist-credentials: false
      - name: Verify approved harness exists (bootstrap fails closed)
        run: test -f .lighthouse-trusted/scripts/lighthouse/Dockerfile
      - name: Lighthouse dedicated lab gate
        uses: ./.lighthouse-trusted/.github/actions/lighthouse
        env:
          LIGHTHOUSE_STORE: ${{ vars.LIGHTHOUSE_STORE }}
          LIGHTHOUSE_CLIENT_ID: ${{ secrets.LIGHTHOUSE_CLIENT_ID }}
          LIGHTHOUSE_CLIENT_SECRET: ${{ secrets.LIGHTHOUSE_CLIENT_SECRET }}
          LIGHTHOUSE_STORE_PASSWORD: ${{ secrets.LIGHTHOUSE_STORE_PASSWORD }}
          LIGHTHOUSE_PRODUCT_HANDLE: ${{ vars.LIGHTHOUSE_PRODUCT_HANDLE }}
          LIGHTHOUSE_COLLECTION_HANDLE: ${{ vars.LIGHTHOUSE_COLLECTION_HANDLE }}
